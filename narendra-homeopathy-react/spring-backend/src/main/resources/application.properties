server.port=${PORT:4000}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/narendra_homeopathy}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:}
app.mail.to=${MAIL_TO:}
app.frontend-origins=${FRONTEND_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174}
